[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-triage"
version = "0.1.0"
description = "Explainable AML transaction-risk triage on synthetic PaySim data (educational capstone)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Julius Pabular" }]
# Runtime dependencies are pinned in requirements.txt (compiled from requirements.in).
dependencies = []

[project.scripts]
aml-triage = "aml_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "notebooks", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/aml_triage/eda/plots.py" = ["E702"]  # dense matplotlib call chains
"src/aml_triage/features/pca.py" = ["E702"]
"src/aml_triage/evaluation/compare.py" = ["E702"]
"src/aml_triage/evaluation/capacity_report.py" = ["E702"]

[tool.ruff.lint.isort]
known-first-party = ["aml_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:aml_triage.*"]

[tool.coverage.run]
source = ["aml_triage"]
branch = true
omit = ["src/aml_triage/api/*"]

[tool.coverage.report]
# Gate enforced by `make coverage` (task T066); target from constitution Principle III.
fail_under = 80
show_missing = true
skip_covered = false
