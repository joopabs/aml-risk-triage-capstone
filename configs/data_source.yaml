name: PaySim - Synthetic Financial Datasets for Fraud Detection
url: https://www.kaggle.com/datasets/ealaxi/paysim1
kaggle_dataset: ealaxi/paysim1
filename: null                 # set at first download (CSV inside the Kaggle zip)
sha256: null                   # set at first download; verified on every later run
size_bytes: null
downloaded_on: null            # ISO date
license_text_verbatim: null    # copied from the Kaggle dataset page (V1)
license_verified_on: null      # ISO date the page was read
license_permits_educational_use: null   # true/false, decided by a human after reading the text
synthetic_notice: "PaySim is synthetic mobile-money transaction data. It is not real SME, corporate, or Philippine banking data."
