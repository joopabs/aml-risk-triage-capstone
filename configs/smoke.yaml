# CI smoke configuration: extends base.yaml and overrides paths and sizes so the full CLI
# sequence runs in minutes on a small synthetic sample produced by scripts/make_sample.py
# (task T063). No PaySim data is used in CI.
_extends: configs/base.yaml
paths:
  raw_csv: data/processed/smoke_sample.csv
  processed_dir: data/processed/smoke
  models_dir: models/smoke
  reports_dir: reports/smoke
# Isolated from the tracked, sealed configs/operating_point.yaml (choose-operating-point refuses otherwise).
operating_point_path: models/smoke/operating_point.yaml
# Isolated copy of the feature registry (select-features rewrites its `selected` markers; `make smoke`
# copies configs/features.yaml here first).
features:
  registry: models/smoke/features.yaml
split:
  train_end_step: 48
  val_end_step: 60
  min_positives_per_split: 20
review:
  review_period_steps: 24
  primary_k: 25
  k_grid: [10, 25, 50]
selection:
  mi_k: 8
  l1_c: 0.1
  min_size: 5
pca:
  n_components: 3
tuning:
  tune_sample_rows: 5000
  n_iter: 3
  cv_folds: 2
bootstrap:
  n_resamples: 20
explain:
  shap_background_rows: 100
  shap_eval_rows: 200
compute:
  n_jobs: 2
  omp_num_threads: 2
