# Base run configuration. Keys marked "set after Vn" are profiling-dependent and
# MUST stay null until the corresponding spec validation task records the value.
seed: 42

paths:
  raw_csv: data/raw/PS_20174392719_1491204439457_log.csv   # V1 recorded 2026-09-05; sha256 in configs/data_source.yaml
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports

split:
  strategy: temporal                   # temporal | stratified_fallback
  train_end_step: 408                  # V9: steps 1-408 = days 1-17 (5,987,417 rows, 4,589 positives); steps.cumulative_positives_by_step
  val_end_step: 552                    # V9: steps 409-552 = days 18-23 (181,068 rows, 1,504 positives); test = 553-743 (194,135 rows, 2,120 positives). Val and test share the low-volume regime (DQ-10)
  min_positives_per_split: 500         # V4: 8,213 positives total; every split above keeps >= 1,500 (target.positives, steps.cumulative_positives_by_step)
  fallback_reason: null

review:
  review_period_steps: 24              # V8: 743 contiguous hourly steps ~ 31 days (steps.n_steps, steps.min_step/max_step)
  primary_k: 200                       # V8: ~1% of median transactions per review period in val+test (20,363; steps.transactions_by_step) and below median positives/day (264), so capacity binds
  k_grid: [50, 100, 200, 300, 500]     # sensitivity around primary_k
  tie_break: [score_desc, step_asc, row_index_asc]

features:
  registry: configs/features.yaml
  default_set: primary
  ablation_sets: [strict_pretx, posttx_ablation]

selection:
  mi_k: 12                             # V10: keep the 12 highest mutual-information features out of ~20 candidates (configs/features.yaml)
  l1_c: 0.1                            # V10: L1 logistic regularisation strength for the embedded selector
  combine_rule: intersection_or_union_if_lt
  min_size: 6                          # V10: fall back to the union if the intersection has fewer than 6 features

pca:
  n_components: 0.95                   # V10: retain components explaining 95% of training variance (diagnostic role)
  role: diagnostic_and_visualization

tuning:
  tune_sample_rows: 1000000            # V3: stratified 1,000,000 of 5,987,417 training rows (~770 positives at 0.0766% prevalence); n_rows, target.prevalence
  n_iter: 30
  cv_folds: 3
  scoring: average_precision

calibration:
  method: isotonic_val                 # none | isotonic_val
  max_pr_auc_drop: 0.005

operating_point_path: configs/operating_point.yaml

bootstrap:
  n_resamples: 200

evaluation:
  degenerate_eps: 1.0e-9

explain:
  shap_background_rows: 1000
  shap_eval_rows: 2000
  n_local_examples: 3
  pdp_top_features: 5

fairness:
  slice_dimensions: [type, amount_band, orig_balance_band, step_band]
  label: "operational error-slice analysis"

compute:
  n_jobs: 4
  omp_num_threads: 4

disclaimer_ref: aml_triage.constants.DISCLAIMER
