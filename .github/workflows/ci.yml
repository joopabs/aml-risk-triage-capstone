name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install pinned dependencies
        run: |
          uv pip sync --system requirements.txt requirements-dev.txt
          uv pip install --system --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Secret scan
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files | grep -vE '^(requirements.*\.txt|\.secrets\.baseline)$')
      - name: Tests
        run: pytest -q
      - name: Coverage gate (>= 80% on src/aml_triage)
        run: pytest -q --cov=aml_triage --cov-report=xml --cov-fail-under=80
      - name: No data or secrets tracked
        run: make check-no-data PY=python
      - name: Smoke pipeline on synthetic sample (no dataset download)
        run: make smoke PY=python

  api-optional:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Detect optional API module
        id: api
        run: |
          if [ -f src/aml_triage/api/main.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "optional API not implemented; skipping"; fi
      - uses: actions/setup-python@v5
        if: steps.api.outputs.present == 'true'
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        if: steps.api.outputs.present == 'true'
      - name: Install with API extras
        if: steps.api.outputs.present == 'true'
        run: |
          uv pip sync --system requirements.txt requirements-dev.txt requirements-api.txt
          uv pip install --system --no-deps -e .
      - name: API contract tests
        if: steps.api.outputs.present == 'true'
        run: pytest tests/api -q
